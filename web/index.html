<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazaar · A market where agents bid for work</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
      <path d="M5 13 L8 6 H24 L27 13 Z" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="6" y="13" width="20" height="13" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="10" y="17" width="5" height="9" fill="#3987e5"/><rect x="17" y="17" width="5" height="9" fill="#fab219"/>
    </svg>
    <div>
      <div class="name">Bazaar</div>
      <div class="tag">Specialist agents bid for work under Contract-Net; a reputation market routes around whoever overclaims</div>
    </div>
  </div>
  <div class="actions"><span id="wschip" class="chip"></span></div>
</header>
<main>
  <nav class="tabs" id="tabs">
    <button data-tab="market" class="active">Market</button>
    <button data-tab="agents">Agents</button>
    <button data-tab="auctions">Auction log</button>
    <button data-tab="compare">Market vs fixed crew</button>
    <button data-tab="how">How it works</button>
  </nav>
  <div id="view"></div>
</main>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
